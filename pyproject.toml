[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abutron-quant"
version = "2.0.0"
description = "ABUTRON QUANT — one-decision-engine scalping desk for Deriv synthetics and FP Markets MT5, with a prop-firm rule guard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ABUTRON" }]
dependencies = []          # stdlib only, by design

[project.optional-dependencies]
live-mt5 = ["MetaTrader5>=5.0.45"]
dev = ["ruff", "mypy"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.setuptools.package-data]
"apex.api" = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

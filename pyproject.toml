[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abutron-quant"
version = "2.6.0"
description = "ABUTRON QUANT — one-decision-engine scalping desk for Deriv synthetics and FP Markets MT5, with a prop-firm rule guard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ABUTRON" }]
dependencies = []          # stdlib only, by design

[project.optional-dependencies]
live-mt5 = ["MetaTrader5>=5.0.45"]
dev = ["ruff", "mypy"]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.setuptools.package-data]
# The portals are data files: every one of them must be inside the wheel, or a
# pip install ships an unstyled dashboard that cannot be fixed from the shell.
"apex.api" = [
  "static/*.html",
  "static/*.js",
  "static/*.css",
  "static/vendor/bootstrap/*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# The contract the repository actually meets (and CI enforces): undefined names,
# syntax errors, bugbear and import order. Stylistic rewrites (UP: Optional[X] ->
# X | None across 200+ signatures) are a separate change, not a lint fix.
select = ["F", "E9", "B", "I"]
ignore = ["E501"]
